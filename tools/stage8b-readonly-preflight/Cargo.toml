[package]
name = "stage8b-readonly-preflight"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
stage8b-r2b-controlled-custody = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
rcgen = "=0.14.7"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync"] }
