[package]
name = "finam-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
broker-core = { path = "../broker-core" }
broker-finam = { path = "../broker-finam" }
chrono.workspace = true
ed25519-dalek.workspace = true
hmac.workspace = true
libc.workspace = true
redis.workspace = true
reqwest.workspace = true
runtime-durable-service = { path = "../runtime-durable-service" }
rusqlite.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strategy-runtime-core = { path = "../strategy-runtime-core" }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[features]
default = []
m3j16-actual-one-shot = []
stage8b-r2a6-controlled-rehearsal = [
    "runtime-durable-service/stage8a4-i3-test-fixtures",
    "strategy-runtime-core/stage5g-artifact-fixtures",
]
stage8b-r2a7-source-adapter = []
stage8b-r2a7-controlled-qualification = [
    "stage8b-r2a7-source-adapter",
    "runtime-durable-service/stage8a4-i3-test-fixtures",
    "strategy-runtime-core/stage5g-artifact-fixtures",
]

[[bin]]
name = "stage8b-r2a6-source-adapter"
path = "src/bin/stage8b-r2a6-source-adapter.rs"
required-features = ["stage8b-r2a6-controlled-rehearsal"]

[[bin]]
name = "stage8b-r2a7-source-adapter"
path = "src/bin/stage8b-r2a7-source-adapter.rs"
required-features = ["stage8b-r2a7-source-adapter"]

[[bin]]
name = "stage8b-r2a7-controlled-seeder"
path = "src/bin/stage8b-r2a7-controlled-seeder.rs"
required-features = ["stage8b-r2a7-controlled-qualification"]

[dev-dependencies]
bytes = "=1.12.0"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", features = ["http2", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
rcgen = "=0.14.7"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
runtime-durable-service = { path = "../runtime-durable-service", features = ["stage8a4-i3-test-fixtures"] }
strategy-runtime-core = { path = "../strategy-runtime-core", features = ["stage5g-artifact-fixtures"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
