name: Stage 5F Base Authority

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Immutable historical base ref
        required: true
        default: 0ce76a334f12bf7b13e682ca976c9a4cde6be137
      candidate_ref:
        description: Immutable historical candidate ref
        required: true
        default: 0ce76a334f12bf7b13e682ca976c9a4cde6be137

# Historical/manual evidence only. This workflow has no pull_request_target,
# pull_request or push trigger and does not enforce the current source tree.
permissions:
  contents: read

jobs:
  base-authority:
    name: base-authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted Stage 5F-a authority snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "8ce0acd60c7cb5cc5d25a27f6553077240658b57"
          path: authority
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable historical base as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ inputs.base_ref }}"
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable historical candidate as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ inputs.candidate_ref }}"
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Validate candidate authority data before execution
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git -C base rev-parse HEAD)"
          python3 base/scripts/stage5f_base_authority_contract.py \
            --authority authority \
            --base base \
            --candidate candidate \
            --base-sha "$base_sha"

      - name: Execute only accepted R3 verifier and B3F provenance
        working-directory: authority
        run: |
          set -euo pipefail
          python3 scripts/stage5f_atomic_hybrid_semantics_entry_check.py
          python3 scripts/stage5f_ci_snapshot_inheritance_check.py --execute-verified-provenance
