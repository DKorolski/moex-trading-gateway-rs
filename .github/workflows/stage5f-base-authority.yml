name: Stage 5F Base Authority

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

# The workflow is evaluated from the protected base branch. It deliberately
# receives no write token and never executes a file from the pull-request head.
permissions:
  contents: read
  pull-requests: read

jobs:
  base-authority:
    name: base-authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout accepted Stage 5F-a authority snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "8ce0acd60c7cb5cc5d25a27f6553077240658b57"
          path: authority
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout protected PR base as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.event.pull_request.base.sha }}"
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pull-request head as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Validate candidate authority data before execution
        shell: bash
        run: |
          set -euo pipefail
          # Execute only the contract copied from the protected PR base.  The
          # candidate remains byte/JSON data, including a future authority
          # rotation manifest.
          python3 base/scripts/stage5f_base_authority_contract.py \
            --authority authority \
            --base base \
            --candidate candidate \
            --base-sha "${{ github.event.pull_request.base.sha }}"

      - name: Execute only accepted R3 verifier and B3F provenance
        working-directory: authority
        run: |
          set -euo pipefail
          python3 scripts/stage5f_atomic_hybrid_semantics_entry_check.py
          python3 scripts/stage5f_ci_snapshot_inheritance_check.py --execute-verified-provenance
