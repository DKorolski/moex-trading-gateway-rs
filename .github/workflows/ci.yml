name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The current authority replays accepted Stage 8 slices from their
          # immutable commits, so their objects must be available locally.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Current-tree authority gate
        run: bash scripts/current_tree_ci_gate.sh
        timeout-minutes: 75

      - name: No-Redis evidence smoke
        run: bash scripts/test_m4_3x_evidence_no_redis.sh

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Cargo test
        run: cargo test --workspace --all-targets -- --test-threads=1

      - name: Cargo release test
        run: cargo test --workspace --release --all-targets -- --test-threads=1

      - name: Cargo doctest
        run: cargo test --workspace --doc

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  redis-smoke:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Redis shadow smoke
        run: scripts/redis_shadow_smoke.sh

      - name: Runtime bridge dry smoke
        run: scripts/runtime_bridge_dry_smoke.sh
